name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Safari/WebKit at an iPad viewport — catches iOS-specific stacking/layout bugs
  # the Chromium run can't (e.g. the sign-in overlay painting under onboarding).
  # Only the login-overlay spec runs here (see playwright.config.js webkit-ipad).
  e2e-safari:
    name: Playwright e2e (iPad Safari)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps webkit
      - run: npm run test:e2e -- --project=webkit-ipad
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-safari
          path: playwright-report/
          retention-days: 7

  # Deploy gate: only fires on a push to main, and only after BOTH test jobs
  # succeed, so no untested commit ever ships. Builds and deploys the Docker
  # image to Fly.io (app "filmowo"). This is the only path to production.
  # Secrets (repo → Settings → Secrets → Actions):
  #   FLY_API_TOKEN — an app-scoped Fly deploy token (`fly tokens create deploy -a filmowo`)
  deploy:
    name: Deploy to Fly
    needs: [unit, e2e, e2e-safari]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN not set — skipping deploy."
            exit 0
          fi
          echo "Tests passed — deploying filmowo to Fly…"
          flyctl deploy --remote-only --ha=false

  # Publishes the image the Hetzner k3s cluster runs. Flux's image automation
  # (movies-gitops/image-automation/automation.yaml) watches this repository for
  # the newest `main-<utc>-<sha7>` tag and commits it into filmowo/all.yaml, so a
  # green push to main IS the deploy. The timestamp makes tags sortable; a bare
  # SHA has no order. Pushed with GITHUB_TOKEN, so no extra secret is needed.
  publish:
    name: Publish image to GHCR
    needs: [unit, e2e, e2e-safari]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute an orderable image tag
        id: tag
        run: |
          set -euo pipefail
          sha='${{ github.sha }}'
          echo "value=main-$(date -u +%Y%m%d%H%M%S)-${sha:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/filmowo:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/filmowo:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
